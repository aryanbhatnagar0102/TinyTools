<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTools - Everyday Utilities</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TinyTools</h1>
        <p>Your everyday tools, all in one place</p>
    </header>

    <main>
        <div id="home-page">
        <input type="text" id="search" placeholder="search tools...">
        <section id="tools-container"></section>
        </div>

        <section id="tool-workspace" class="hidden">
            <button id="back-button">← Back to Tools</button>
            <h2 id="tool-title"></h2>
            <div id="tool-content"></div>
        </section>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
